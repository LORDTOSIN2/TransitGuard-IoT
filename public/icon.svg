<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3"/>
  <!-- LoRa Mesh signal waves -->
  <path d="M150 160 A 180 180 0 0 1 362 160" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M190 200 A 130 130 0 0 1 322 200" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M228 240 A 80 80 0 0 1 284 240" fill="none" stroke="#06b6d4" stroke-width="16" stroke-linecap="round"/>
  <!-- Bus icon silhouette -->
  <g transform="translate(136, 260)" filter="url(#glow)">
    <rect x="20" y="0" width="200" height="150" rx="24" fill="url(#accent)"/>
    <rect x="36" y="20" width="168" height="55" rx="10" fill="#030712"/>
    <!-- Headlights -->
    <circle cx="48" cy="115" r="14" fill="#facc15"/>
    <circle cx="192" cy="115" r="14" fill="#facc15"/>
    <line x1="85" y1="115" x2="155" y2="115" stroke="#030712" stroke-width="8" stroke-linecap="round"/>
    <!-- Wheels -->
    <rect x="40" y="145" width="36" height="24" rx="8" fill="#1e293b"/>
    <rect x="164" y="145" width="36" height="24" rx="8" fill="#1e293b"/>
    <!-- Eye Landmark / AI Fatigue pupil in center of windshield -->
    <circle cx="120" cy="47" r="16" fill="#06b6d4"/>
    <circle cx="120" cy="47" r="7" fill="#ffffff"/>
  </g>
</svg>
